service: mofiXqshelter-agent-func
useDotenv: true

plugins:
  #- serverless-offline
  - serverless-webpack
 
package:
  individually: false

provider:
  name: aws
  runtime: nodejs20.x
  stage: prod
  region: us-east-1
  httpApi: # Use HTTP API configuration
    payload: '2.0'
  environment:
    DB_PORT: 3306
    DB_USERNAME: ${env:MOFI_MOFI_DB_USERNAME}
    DB_PASSWORD: ${env:MOFI_MOFI_DB_PASSWORD}
    DB_NAME: ${env:MOFI_MOFI_DB_DATABASE}
    DB_HOST: ${env:MOFI_MOFI_DB_HOST}
    AWS_S3_BUCKET_NAME: ${env:MOFI_MOFI_CUSTOM_AWS_BUCKET}
    AWS_S3_ACCESS_KEY_ID: ${env:MOFI_MOFI_CUSTOM_AWS_ACCESS_KEY_ID}
    AWS_S3_SECRET_ACCESS_KEY: ${env:MOFI_MOFI_CUSTOM_AWS_SECRET_ACCESS_KEY}
    AWS_S3_REGION: us-east-1
    PRESIGNED_URL_TTL: 3600
    COMMISSION_PERCENTAGE: 2.5
    NODE_ENV: 'production'
    
custom:
  webpack:
    webpackConfig: './webpack.config.js'
    includeModules: true # This will include required node modules

functions:
  main:
    handler: dist/serverless.handler
    events:
      - httpApi:
          method: ANY
          path: /
      - httpApi:
          method: ANY
          path: /{proxy+}

